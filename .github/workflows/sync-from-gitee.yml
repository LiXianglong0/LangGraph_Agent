# 以 Gitee 为准，每天同步到 GitHub
name: Sync from Gitee

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: sync-from-gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch Gitee and push to GitHub main
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_REPO:-}" ]; then
            echo "请在 GitHub Secrets 中设置 GITEE_REPO"
            exit 1
          fi
          if [ -z "${GH_PAT:-}" ]; then
            echo "请在 GitHub Secrets 中设置 GH_PAT（classic token，勾选 repo + workflow）"
            exit 1
          fi

          if [ -n "${GITEE_TOKEN:-}" ]; then
            AUTH_REPO="$(echo "$GITEE_REPO" | sed "s#https://#https://oauth2:${GITEE_TOKEN}@#")"
          else
            AUTH_REPO="$GITEE_REPO"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          git remote remove gitee 2>/dev/null || true
          git remote add gitee "$AUTH_REPO"
          git fetch gitee

          if git show-ref --verify --quiet refs/remotes/gitee/main; then
            SRC=gitee/main
          elif git show-ref --verify --quiet refs/remotes/gitee/master; then
            SRC=gitee/master
          else
            echo "Gitee 上未找到 main/master 分支"
            git branch -r
            exit 1
          fi

          git checkout -B main "$SRC"
          git push --force origin main
          echo "已将 $SRC 同步到 origin/main"
